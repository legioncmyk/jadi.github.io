<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>firli.aja - Jual Akun Premium</title>
    <meta name="description" content="Jual akun premium, top up game, dan jasa digital terpercaya">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="LINK_LOGO_DISINI" alt="firli.aja" class="logo-img">
            </div>
            <div class="site-name">firli.aja</div>
        </div>
    </header>

    <main class="main-content">
        <div class="page-header">
            <h1>Produk Lengkap</h1>
            <p class="page-subtitle">Semua akun dan top up tersedia</p>
        </div>

        <div class="products-grid">
            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_MLBB_SKIN_DISINI" alt="MLBB Skin Bundle">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 25.000</div>
                    <div class="product-name">MLBB Skin Bundle</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_CODM_DISINI" alt="COD Mobile CP">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 80.000</div>
                    <div class="product-name">CODM CP 880</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_ROBLOX_DISINI" alt="Robux">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 60.000</div>
                    <div class="product-name">Robux 800</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_YOUTUBE_PREMIUM_DISINI" alt="YouTube Premium">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 55.000</div>
                    <div class="product-name">YouTube Premium 1bln</div>
                </div>
            </div>
        </div>
    </main>

    <nav class="navbar">
        <div class="nav-item" data-page="index">
            <div class="nav-icon">📦</div>
            <span>Produk</span>
        </div>
        <div class="nav-item active" data-page="informasi">
            <div class="nav-icon">ℹ️</div>
            <span>Informasi</span>
        </div>
        <div class="nav-item" data-page="menu">
            <div class="nav-icon">☰</div>
            <span>Menu</span>
        </div>
        <div class="nav-item" data-page="jasa">
            <div class="nav-icon">🔧</div>
            <span>Jasa</span>
        </div>
        <div class="nav-item" data-page="media">
            <div class="nav-icon">📱</div>
            <span>Media</span>
        </div>
    </nav>

    <script src="js/script.js"></script>

</html>
