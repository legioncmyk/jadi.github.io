<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>firli.aja - Akun Premium</title>
    <meta name="description" content="Jual akun premium, top up game, dan jasa digital terpercaya">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="LINK_LOGO_DISINI" alt="firli.aja" class="logo-img">
            </div>
            <div class="site-name">firli.aja</div>
        </div>
    </header>

    <main class="main-content">
        <div class="hero">
            <h1 class="hero-title">Akun Premium</h1>
            <p class="hero-subtitle">Game, top up, jasa digital</p>
        </div>

        <div class="products-grid">
            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_MOBILE_LEGENDS_DISINI" alt="Mobile Legends Premium">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 75.000</div>
                    <div class="product-name">Mobile Legends Premium</div>
                </div>
            </div>

            <div class="product-card bestseller">
                <div class="product-badge">Best Seller</div>
                <div class="product-image">
                    <img src="LINK_GAMBAR_FF_DISINI" alt="Free Fire Diamond">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 50.000</div>
                    <div class="product-name">Free Fire Diamond 1000</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_PUBG_DISINI" alt="PUBG UC">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 120.000</div>
                    <div class="product-name">PUBG UC 300</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_GENSIN_DISINI" alt="Genshin Impact">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 200.000</div>
                    <div class="product-name">Genshin Genesis</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_VALORANT_DISINI" alt="Valorant Points">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 150.000</div>
                    <div class="product-name">Valorant Points 5000</div>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image">
                    <img src="LINK_GAMBAR_SPOTIFY_DISINI" alt="Spotify Premium">
                </div>
                <div class="product-info">
                    <div class="product-price">Rp 45.000</div>
                    <div class="product-name">Spotify Premium 3bln</div>
                </div>
            </div>
        </div>
    </main>

    <nav class="navbar">
        <div class="nav-item active" data-page="index">
            <div class="nav-icon">📦</div>
            <span>Produk</span>
        </div>
        <div class="nav-item" data-page="informasi">
            <div class="nav-icon">ℹ️</div>
            <span>Informasi</span>
        </div>
        <div class="nav-item" data-page="menu">
            <div class="nav-icon">☰</div>
            <span>Menu</span>
        </div>
        <div class="nav-item" data-page="jasa">
            <div class="nav-icon">🔧</div>
            <span>Jasa</span>
        </div>
        <div class="nav-item" data-page="media">
            <div class="nav-icon">📱</div>
            <span>Media</span>
        </div>
    </nav>

    <script src="js/script.js"></script>
</body>
</html>
